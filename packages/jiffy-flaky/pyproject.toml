[project]
name = "jiffy-flaky"
version = "0.1.0"
description = "A messaging provider that misbehaves on purpose, and keeps a log you can audit afterwards."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Zeeshan Adil", email = "zeeabutt@outlook.com" }]
keywords = ["testing", "fault-injection", "webhooks", "idempotency", "chaos"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
jiffy-flaky = "jiffy_flaky.cli:main"

[project.urls]
Source = "https://github.com/ZeeshanAdilButt/jiffy-flaky"
Monorepo = "https://github.com/ZeeshanAdilButt/distributed-systems-challenges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiffy_flaky"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET"]
# Exceptions are named for what happened (LeaseLost), not suffixed with Error.
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["jiffy_lease", "jiffy_flaky", "jiffy_chaos", "fencing_demo", "courier"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
exclude = ["mutants/"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# mutmut leaves a copy of the tests in mutants/; collecting it would count them twice.
norecursedirs = [".*", "*.egg", "build", "dist", "venv", "mutants"]
markers = ["slow: runs real processes for several seconds"]
