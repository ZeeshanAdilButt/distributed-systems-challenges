[project]
name = "jiffy-ring"
version = "0.1.0"
description = "Three ways to decide which database owns a key: modulo, fixed buckets and a hash ring with virtual nodes."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Zeeshan Adil", email = "zeeabutt@outlook.com" }]
keywords = ["consistent-hashing", "sharding", "partitioning", "hash-ring", "vnodes"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Database",
]
dependencies = []

[project.urls]
Monorepo = "https://github.com/ZeeshanAdilButt/distributed-systems-challenges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiffy_ring"]
