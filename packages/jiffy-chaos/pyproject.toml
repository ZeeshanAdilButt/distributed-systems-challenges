[project]
name = "jiffy-chaos"
version = "0.1.0"
description = "Real-process chaos for tests: supervise workers, kill -9 them, freeze them, crash Postgres."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Zeeshan Adil", email = "zeeabutt@outlook.com" }]
keywords = ["chaos", "testing", "postgres", "sigkill", "fault-injection"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Testing",
]
dependencies = ["psutil>=6", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
pytest = ["pytest>=8"]

[project.scripts]
jiffy-chaos = "jiffy_chaos.cli:main"

[project.entry-points.pytest11]
jiffy_chaos = "jiffy_chaos.pytest_plugin"

[project.urls]
Source = "https://github.com/ZeeshanAdilButt/jiffy-chaos"
Monorepo = "https://github.com/ZeeshanAdilButt/distributed-systems-challenges"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiffy_chaos"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["mutants"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "N", "C4", "PIE", "RET"]
# Exceptions are named for what happened (LeaseLost), not suffixed with Error.
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["jiffy_lease", "jiffy_flaky", "jiffy_chaos", "fencing_demo", "courier"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
exclude = ["mutants/"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
markers = ["slow: runs real processes for several seconds"]
