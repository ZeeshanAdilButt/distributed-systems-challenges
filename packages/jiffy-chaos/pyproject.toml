[project]
name = "jiffy-chaos"
version = "0.1.0"
description = "Real-process chaos for tests: supervise workers, kill -9 them, freeze them, crash Postgres."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Zeeshan Adil", email = "zeeabutt@outlook.com" }]
keywords = ["chaos", "testing", "postgres", "sigkill", "fault-injection"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
    "Topic :: Software Development :: Testing",
]
dependencies = ["psutil>=6", "psycopg[binary]>=3.2"]

[project.optional-dependencies]
pytest = ["pytest>=8"]

[project.scripts]
jiffy-chaos = "jiffy_chaos.cli:main"

[project.entry-points.pytest11]
jiffy_chaos = "jiffy_chaos.pytest_plugin"

[project.urls]
Source = "https://github.com/ZeeshanAdilButt/distributed-systems-challenges/tree/main/packages/jiffy-chaos"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jiffy_chaos"]
