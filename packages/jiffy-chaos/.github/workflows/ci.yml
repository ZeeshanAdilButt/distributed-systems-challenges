name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The runner image ships the PostgreSQL server binaries, which LocalCluster uses.
      - run: pip install -e ".[pytest]" pytest==9.1.1 mypy==2.4.0 ruff==0.17.0 types-psutil==7.2.2.20260906
      - run: ruff check . && ruff format --check .
      - run: mypy src tests
      - run: pytest -q
