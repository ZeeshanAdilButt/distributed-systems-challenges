[project]
name = "fencing-demo"
version = "0.1.0"
description = "A lease with a fencing epoch, and a test that runs the zombie as a real second process."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fencing_demo"]
