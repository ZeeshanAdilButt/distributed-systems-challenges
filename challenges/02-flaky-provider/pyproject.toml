[project]
name = "courier"
version = "0.1.0"
description = "Send one message per action through a provider that times out, duplicates and reorders."
requires-python = ">=3.12"
dependencies = [
    "jiffy-lease",
    "jiffy-flaky",
    "jiffy-chaos",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
jiffy-lease = { workspace = true }
jiffy-flaky = { workspace = true }
jiffy-chaos = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["courier"]

# Mutation testing covers the claim, finish and outbox code. The process plumbing
# (worker loop, CLI, harness) is exercised by the real-process tests instead.
[tool.mutmut]
source_paths = ["courier/"]
do_not_mutate = [
    "courier/__main__.py",
    "courier/bench.py",
    "courier/chaos.py",
    "courier/cli.py",
    "courier/config.py",
    "courier/db.py",
    "courier/harness.py",
    "courier/intake.py",
    "courier/provider.py",
    "courier/testing.py",
    "courier/webhooks.py",
    "courier/worker.py",
]
pytest_add_cli_args = ["--import-mode=importlib", "-p", "no:cacheprovider", "-m", "not slow"]
pytest_add_cli_args_test_selection = ["tests/"]
