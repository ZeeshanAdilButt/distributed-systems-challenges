[project]
name = "shardbox"
version = "0.1.0"
description = "A Comments API sharded across real SQLite databases: modulo, fixed buckets or a hash ring, with live migration."
requires-python = ">=3.12"
dependencies = ["jiffy-ring"]

[project.scripts]
shardbox = "shardbox.__main__:main"

[tool.uv.sources]
jiffy-ring = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shardbox"]
artifacts = ["shardbox/ui/*"]
