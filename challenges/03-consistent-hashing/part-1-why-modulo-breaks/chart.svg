<text x="481.2" y="282" font-size="12" fill="#888780" text-anchor="middle">ring, 64 vnodes</text>
<rect x="586.4" y="229.3" width="28.0" height="34.7" rx="3" fill="#2a78d6"><title>key ranges: 17%</title></rect>
