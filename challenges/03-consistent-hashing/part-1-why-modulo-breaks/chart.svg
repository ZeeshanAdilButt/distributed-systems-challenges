<line x1="64" x2="660" y1="264.0" y2="264.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="268.0" font-size="11" fill="#888780" text-anchor="end">0%</text>
<line x1="64" x2="660" y1="212.0" y2="212.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="216.0" font-size="11" fill="#888780" text-anchor="end">25%</text>
<line x1="64" x2="660" y1="160.0" y2="160.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="164.0" font-size="11" fill="#888780" text-anchor="end">50%</text>
<line x1="64" x2="660" y1="108.0" y2="108.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="112.0" font-size="11" fill="#888780" text-anchor="end">75%</text>
<line x1="64" x2="660" y1="56.0" y2="56.0" stroke="#88878055" stroke-width="1"/>
<text x="56" y="60.0" font-size="11" fill="#888780" text-anchor="end">100%</text>
<rect x="109.6" y="107.9" width="28.0" height="156.1" rx="3" fill="#2a78d6"><title>hash % n: 75%</title></rect>
<text x="123.6" y="102.9" font-size="11" fill="#888780" text-anchor="middle">75%</text>
<text x="123.6" y="282" font-size="12" fill="#888780" text-anchor="middle">hash % n</text>
<rect x="228.8" y="212.0" width="28.0" height="52.0" rx="3" fill="#2a78d6"><title>12 fixed buckets: 25%</title></rect>
<text x="242.8" y="207.0" font-size="11" fill="#888780" text-anchor="middle">25%</text>
<text x="242.8" y="282" font-size="12" fill="#888780" text-anchor="middle">12 fixed buckets</text>
<rect x="348.0" y="262.6" width="28.0" height="1.4" rx="3" fill="#2a78d6"><title>ring, 1 token: 0.7%</title></rect>
