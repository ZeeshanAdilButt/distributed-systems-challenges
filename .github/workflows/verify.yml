name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    # The same path as "only Docker installed": build the image, run the gates in it.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f shared/docker/Dockerfile -t dsc-verify .
      - run: docker run --rm --shm-size=256m dsc-verify --quick
