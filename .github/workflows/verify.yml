name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    # The same path as "only Docker installed": build the image, run the gates in it.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f shared/docker/Dockerfile -t dsc-verify .
      - run: docker run --rm --shm-size=256m dsc-verify --quick

  go:
    # Challenge 04's Go versions of request coalescing. The Docker image has no Go, so
    # they get their own small job.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: challenges/04-cache-stampede/part-4-one-refresh-per-key/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go run ./cmd/onekey
      - run: go run ./cmd/fleet
